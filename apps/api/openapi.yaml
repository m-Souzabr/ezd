openapi: 3.0.3
info:
  title: EZDesign API
  version: '1'
paths:
  /api/admin/audit/:
    get:
      operationId: admin_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: An action, or the start of one.
      - in: query
        name: actor
        schema:
          type: string
        description: An actor's id or part of their email.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
  /api/admin/config/draft/:
    get:
      operationId: admin_config_draft_retrieve
      description: The configuration being edited. Without a saved draft it is the
        published one.
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDraft'
          description: ''
    put:
      operationId: admin_config_draft_update
      description: Saves the draft if `revision` is the one the editor loaded, else
        409.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigDraftUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDraft'
          description: ''
  /api/admin/config/publish/:
    post:
      operationId: admin_config_publish_create
      description: Makes the draft the new published version, which is never changed
        again.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigPublishRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigVersion'
          description: ''
  /api/admin/config/versions/:
    get:
      operationId: admin_config_versions_list
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigVersion'
          description: ''
  /api/admin/config/versions/{number}/rollback/:
    post:
      operationId: admin_config_versions_rollback_create
      description: Publishes a copy of an old version as a new one. The old rows stay
        as they were.
      parameters:
      - in: path
        name: number
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigRollbackRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigVersion'
          description: ''
  /api/admin/roles/:
    get:
      operationId: admin_roles_list
      description: The roles and the permission codes each one holds. Read-only.
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
          description: ''
  /api/admin/users/:
    get:
      operationId: admin_users_list
      description: Every account, for staff. Searchable, filterable and sortable.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_staff
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
        description: The name of a role.
      - in: query
        name: search
        schema:
          type: string
        description: Part of the email or name.
      - in: query
        name: sort
        schema:
          type: string
        description: A column, with `-` for descending.
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: admin_users_create
      description: Creates an account with no password and emails its owner a link
        to choose one.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: Changes name, email, active, staff, superuser or roles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/users/{id}/reset-password/:
    post:
      operationId: admin_users_reset_password_create
      description: Emails the account's owner a link to choose a new password.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Starts a session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Ends the session.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The signed-in user. Sets the CSRF cookie either way, also on a
        401.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: Emails a reset link. Answers the same whether or not the account
        exists.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Sets a new password with the uid and token from the reset link.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates an account and signs it in, unless registration is closed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/chat/messages/{id}/resolve/:
    post:
      operationId: chat_messages_resolve_create
      description: Records what the user did with a proposal, or that it could not
        be used.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/chat/messages/{id}/retry/:
    post:
      operationId: chat_messages_retry_create
      description: Asks again after a failed attempt, with the reasons it failed.
        Twice at most.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
          description: ''
  /api/chat/usage/:
    get:
      operationId: chat_usage_retrieve
      description: This month's assistant usage of the signed-in user, and the monthly
        allowance.
      tags:
      - chat
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
          description: ''
  /api/config/:
    get:
      operationId: config_retrieve
      description: 'The published configuration. Anyone may read it: the editor at
        `/` needs no session.'
      tags:
      - config
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
          description: ''
  /api/designs/{id}/:
    get:
      operationId: designs_retrieve
      description: Read with the draft document, rename, or delete with every snapshot.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - designs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Design'
          description: ''
    patch:
      operationId: designs_partial_update
      description: Read with the draft document, rename, or delete with every snapshot.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - designs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDesignRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Design'
          description: ''
    delete:
      operationId: designs_destroy
      description: Read with the draft document, rename, or delete with every snapshot.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - designs
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/designs/{id}/chat/:
    get:
      operationId: designs_chat_retrieve
      description: 'The chat of a design: its latest conversation, and a new message
        to the assistant.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - designs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
    post:
      operationId: designs_chat_create
      description: 'Asks the assistant. Its tool calls are a proposal: nothing changes
        until accepted.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - designs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
          description: ''
  /api/designs/{id}/draft/:
    put:
      operationId: designs_draft_update
      description: Autosave. Stores `document` only if the draft is still at `base_revision`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - designs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftSaveRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftSaved'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftConflict'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidDocument'
          description: ''
  /api/designs/{id}/quotes/:
    get:
      operationId: designs_quotes_list
      description: The quotes of a design, newest first, without their lines and drawings.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - designs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteSummaryList'
          description: ''
    post:
      operationId: designs_quotes_create
      description: Snapshots the draft as a new version of the design and stores the
        quote for it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - designs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleDraft'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InconsistentQuote'
          description: ''
  /api/designs/{id}/versions/:
    get:
      operationId: designs_versions_list
      description: The snapshots of a design, newest first, without their documents.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - designs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDesignVersionSummaryList'
          description: ''
    post:
      operationId: designs_versions_create
      description: Snapshots the current draft as the next version of the design.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - designs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignVersionCreateRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignVersionSummary'
          description: ''
  /api/designs/{id}/versions/{number}/:
    get:
      operationId: designs_versions_retrieve
      description: One snapshot with its document.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: number
        schema:
          type: integer
        required: true
      tags:
      - designs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignVersion'
          description: ''
  /api/designs/{id}/versions/{number}/restore/:
    post:
      operationId: designs_versions_restore_create
      description: Copies the snapshot into the draft, as a new revision. The snapshot
        is kept.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: number
        schema:
          type: integer
        required: true
      tags:
      - designs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Design'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Liveness probe. Does not touch the database.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/llm/settings/:
    get:
      operationId: llm_settings_retrieve
      description: The assistant's API key and models, for the whole site. Staff only.
      tags:
      - llm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMSettings'
          description: ''
    patch:
      operationId: llm_settings_partial_update
      description: Stores the key encrypted. The answer shows only its last four characters.
      tags:
      - llm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLLMSettingsUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMSettings'
          description: ''
  /api/photo-drafts/{id}/:
    get:
      operationId: photo_drafts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - photo-drafts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoDraft'
          description: ''
    patch:
      operationId: photo_drafts_partial_update
      description: Saves the user's corrections. Only a `ready` draft can change.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - photo-drafts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPhotoDraftUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoDraft'
          description: ''
  /api/photo-drafts/{id}/confirm/:
    post:
      operationId: photo_drafts_confirm_create
      description: Creates the design and its version 1 from the confirmed draft.
        Once only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - photo-drafts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoDraftConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Design'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidDocument'
          description: ''
  /api/photo-drafts/{id}/discard/:
    post:
      operationId: photo_drafts_discard_create
      description: Marks the draft discarded. A confirmed draft cannot be discarded.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - photo-drafts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoDraft'
          description: ''
  /api/photos/{id}/:
    get:
      operationId: photos_retrieve
      description: Read, or delete with its file and drafts. Designs made from it
        are kept.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - photos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
          description: ''
    delete:
      operationId: photos_destroy
      description: Read, or delete with its file and drafts. Designs made from it
        are kept.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - photos
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/photos/{id}/analyze/:
    post:
      operationId: photos_analyze_create
      description: 'Runs the vision model on the photo and stores a new draft: `ready`
        or `failed`.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - photos
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoDraft'
          description: ''
  /api/photos/{id}/file/:
    get:
      operationId: photos_file_retrieve
      description: The photo itself, as a JPEG. Only its owner can read it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - photos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/projects/:
    get:
      operationId: projects_list
      description: The user's projects that are not archived, newest first.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
