            type: string
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        active_projects:
          type: integer
          readOnly: true
        chat_tokens_this_month:
          type: integer
          readOnly: true
