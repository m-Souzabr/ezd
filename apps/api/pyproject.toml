[project]
name = "ezd-api"
version = "0.0.0"
description = "EZDesign API (Django)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Migrations are generated by Django; leave them as generated.
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]
