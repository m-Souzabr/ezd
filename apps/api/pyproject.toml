[project]
name = "ezd-api"
version = "0.0.0"
description = "EZDesign API (Django)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.0",
    "jsonschema>=4.26.0",
    "openai>=3.50.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pycryptodome>=4.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Migrations are generated by Django; leave them as generated.
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["E402", "F403", "F405"]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/migrations/*",
    ".venv/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    "config/settings/dev.py",
    "config/settings/prod.py",
]

[tool.coverage.report]
fail_under = 90
skip_covered = true
show_missing = true
