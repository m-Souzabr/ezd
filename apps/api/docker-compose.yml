# Local development services. Values come from apps/api/.env when present.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ezd}
      POSTGRES_USER: ${POSTGRES_USER:-ezd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezd}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ezd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # The API in a container. Not started by a plain `docker compose up`, which is the
  # database for `runserver` and pytest:
  #
  #   docker compose --profile api up --build
  api:
    profiles: [api]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://${POSTGRES_USER:-ezd}:${POSTGRES_PASSWORD:-ezd}@db:5432/${POSTGRES_DB:-ezd}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  ezd-pgdata:
