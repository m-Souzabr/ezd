# Local development services. Values come from apps/api/.env when present.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ezd}
      POSTGRES_USER: ${POSTGRES_USER:-ezd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezd}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ezd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ezd-pgdata:
