name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each check runs even if an earlier one failed, so one run reports every failure.
      - run: pnpm format:check
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}
      - name: JSON Schema files match the Zod schemas
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter @ezd/core schema
          git add --intent-to-add packages/core/schema
          git diff --exit-code -- packages/core/schema

  # The editor driven in a real browser. Kept apart from `js` so the browser download does
  # not slow the unit tests down.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Playwright browser
        run: pnpm --filter @ezd/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ezd/web e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ezd
          POSTGRES_USER: ezd
          POSTGRES_PASSWORD: ezd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezd -d ezd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ezd:ezd@localhost:5432/ezd
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/api
      # `pnpm run`, not `pnpm licenses`: the bare form is pnpm's own built-in command.
      - name: JS licenses
        run: pnpm run licenses
      - name: Python licenses
        if: ${{ !cancelled() }}
        run: pnpm run licenses:py
