name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each check runs even if an earlier one failed, so one run reports every failure.
      - run: pnpm format:check
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}
      # The JS and CSS the editor loads before it starts, gzipped: 350 kB at most.
      - name: Bundle size
        if: ${{ !cancelled() }}
        run: pnpm --filter @ezd/web bundle-size
      - name: No TODO or FIXME without a linked issue
        if: ${{ !cancelled() }}
        run: pnpm run todos
      - name: JSON Schema files match the Zod schemas
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter @ezd/core schema
          git add --intent-to-add packages/core/schema
          git diff --exit-code -- packages/core/schema

  # The editor driven in a real browser. Kept apart from `js` so the browser download does
  # not slow the unit tests down. Playwright starts the web dev server and the API, which
  # needs PostgreSQL and the Python environment.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ezd
          POSTGRES_USER: ezd
          POSTGRES_PASSWORD: ezd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezd -d ezd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ezd:ezd@localhost:5432/ezd
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/api
      - name: Install the Playwright browser
        run: pnpm --filter @ezd/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ezd/web e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ezd
          POSTGRES_USER: ezd
          POSTGRES_PASSWORD: ezd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezd -d ezd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ezd:ezd@localhost:5432/ezd
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      # The API validates documents by running `ezd-core`, so the tests need it built.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ezd/core-cli build
      - run: uv run ruff check
        if: ${{ !cancelled() }}
      - run: uv run ruff format --check
        if: ${{ !cancelled() }}
      - run: uv run python manage.py makemigrations --check --dry-run
        if: ${{ !cancelled() }}
      # Fails below 90 percent (pyproject.toml).
      - run: uv run pytest --cov
        if: ${{ !cancelled() }}
      # The assistant's eval suite, on the recorded responses: no vendor, no key.
      - name: Eval suite (FakeClient)
        if: ${{ !cancelled() }}
        run: uv run python manage.py run_evals --client fake --min-accuracy 1 --out ../../evals/reports/ci
      - name: Eval report
        if: ${{ !cancelled() }}
        run: cat ../../evals/reports/ci/report.md >> "$GITHUB_STEP_SUMMARY"
      # The photo test set, on the recorded answers: every answer must convert.
      - name: Photo eval suite (FakeClient)
        if: ${{ !cancelled() }}
        run: uv run python manage.py run_photo_evals --client fake --min-schema-valid 1 --out ../../evals/reports/ci-photos
      - name: Photo eval report
        if: ${{ !cancelled() }}
        run: cat ../../evals/reports/ci-photos/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: OpenAPI file and TypeScript types match the API
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          pnpm run openapi
          git add --intent-to-add apps/api/openapi.yaml apps/web/src/api/schema.d.ts
          git diff --exit-code -- apps/api/openapi.yaml apps/web/src/api/schema.d.ts

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/api
      # `pnpm run`, not `pnpm licenses`: the bare form is pnpm's own built-in command.
      - name: JS licenses
        run: pnpm run licenses
      - name: Python licenses
        if: ${{ !cancelled() }}
        run: pnpm run licenses:py
      - name: License report
        if: ${{ !cancelled() }}
        run: pnpm run licenses:report
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: license-report
          path: licenses-report/
          retention-days: 90

  # Secrets in the history, and known vulnerabilities in the dependencies. High severity or
  # worse fails the job.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
        if: ${{ !cancelled() }}
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: JS dependency audit
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high
      # pip-audit runs from uvx, outside the API's dependency tree.
      - name: Python dependency audit
        if: ${{ !cancelled() }}
        working-directory: apps/api
        run: |
          uv export --frozen --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --vulnerability-service osv -r "$RUNNER_TEMP/requirements.txt"
